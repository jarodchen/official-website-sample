# Deploy the pre-built static site in ./dist to GitHub Pages.
#
# This repo holds only the built output (dist/), produced locally by:
#   cd ../cairn-server && go run ./cmd/cairn-server
#   powershell scripts/build-with-api.ps1 -SiteUrl https://jarodchen.github.io -SiteBase /official-website-sample
#   # then copy dist/* into this repo and push
# So the workflow only uploads the artifact and deploys it -- no build step.
#
# Setup (once): Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
